<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵台 · LingTai OS</title>
<link rel="stylesheet" href="style.css">
<script>
  // 主题先于渲染应用（防闪白）；默认墨色，可选宣纸
  try { document.documentElement.dataset.theme = localStorage.getItem("lt-theme") || "dark"; } catch (e) {}
</script>
</head>
<body>
<aside class="nav">
  <!-- Logo：观星台。「灵台」本义就是周代的天文台——三级渐宽的台基托一颗星。
       小尺寸下只剩「三条横线＋一个圆」，轮廓仍认得出。
       渐变走 --logo-a/--logo-b：两个主题各一套，墨色下要亮、宣纸下要压得住。 -->
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" style="stop-color: var(--logo-a)"/>
          <stop offset="1" style="stop-color: var(--logo-b)"/>
        </linearGradient>
      </defs>
      <circle cx="12" cy="4.6" r="2.6" fill="url(#lg)"/>
      <rect x="8.4" y="10.4" width="7.2"  height="2.2" rx="1.1" fill="url(#lg)"/>
      <rect x="5.8" y="14.6" width="12.4" height="2.2" rx="1.1" fill="url(#lg)" opacity=".8"/>
      <rect x="3.2" y="18.8" width="17.6" height="2.2" rx="1.1" fill="url(#lg)" opacity=".6"/>
    </svg>
    <span class="brand-text">灵台AI操作系统<span class="brand-en">LingTai OS<i class="ver" id="ver-badge"></i></span></span>
  </div>
  <button class="nav-btn" data-page="home">首页</button>
  <button class="nav-btn" data-page="projects">项目库</button>
  <!-- 这一项原来叫「设置」，而那一页里大部分是**维护者的工作台**，不是用户的设置
       （连它自己的折叠区都写着「一般不用管」）。用户真会来这一页只为两件事：
       我的东西存在哪、换电脑怎么办——那就叫它「我的文件」。
       坑库仍然不进导航：它的入口是首页那个「经验库 N」大格子，点数字就进去。 -->
  <button class="nav-btn" data-page="system">我的文件</button>
  <button class="nav-btn" id="theme-toggle">🌙 墨色</button>
  <div class="nav-dev">
    <span class="dev-label">开发者 VX</span>
    <span class="dev-row"><b id="dev-wx">nexusaistart</b><button type="button" class="dev-copy" id="dev-copy">复制</button></span>
    <!-- 零遥测 = 有没有人在用你永远不知道。唯一诚实的办法是给一个用户自愿的出口。
         它属于「联系方式」这个角落，不该夹在首页的告警和项目列表中间。
         没跑起来过任何项目时不显示——没被帮到过就问「帮到你了吗」，答案没有信息量。 -->
    <a class="dev-feedback" id="nav-feedback" href="#" target="_blank" rel="noopener" hidden>这东西帮到你了？说一声 →</a>
  </div>
  <div class="nav-foot" id="nav-foot"></div>
</aside>
<main id="main"></main>
<script src="app.js"></script>
</body>
</html>
